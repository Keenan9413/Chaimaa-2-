<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon amoureuse ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#4CAF50,#2e7d32); /* ✅ VERT */
  font-family:Arial,sans-serif;
  overflow:hidden;
  transition:background 1s ease;
}

/* ===== TITRE ===== */
#title{
  position:fixed;
  top:95px;
  left:50%;
  transform:translateX(-50%);
  font-size:30px;
  font-weight:900;
  color:#c00000;
  text-decoration:underline;
  z-index:20;
}

/* ===== CARTES ===== */
.card{
  display:none;
  background:#ffffff;
  padding:25px;
  border-radius:22px;
  width:90%;
  max-width:360px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
  position:relative;
  z-index:5;
}

/* ===== INTRO ===== */
.introTitle{
  font-size:30px;
  font-weight:900;
  margin-bottom:15px;
}

/* ===== ENVELOPPE ===== */
.envelope{
  width:200px;
  cursor:pointer;
  animation:bounce 1.4s infinite;
}
@keyframes bounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

/* ===== BOUTONS ===== */
button{
  padding:12px 22px;
  border:none;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
  margin:10px;
}
#yes{background:#4CAF50;color:white;}
#no{background:#ccc;position:absolute}

</style>
</head>

<body>

<div id="title">À ma femme</div>

<div class="card" id="intro">
  <div class="introTitle">Pour Chaimaa ❤️</div>
  <p>Clique sur l’enveloppe</p>
  <img src="IMG_5431.jpeg" class="envelope" onclick="openIntro()">
</div>

<!-- ✅ NOUVELLE SECTION -->
<div class="card" id="question">
  <img src="IMG_3018.jpeg" style="width:100%;border-radius:15px;margin-bottom:15px;">
  
  <h2>Tu te souviens de cette journée ?</h2>

  <button id="yes" onclick="reponseOui()">Oui ❤️</button>
  <button id="no" onmouseover="moveNo()">Non 💔</button>
</div>

<script>

window.onload=()=>intro.style.display="block";

function openIntro(){
  intro.style.display="none";
  question.style.display="block";
  document.body.style.background = "#000";
}

function reponseOui(){
  document.body.innerHTML = `
    <div style="
      height:100vh;
      background:url('IMG_3018.jpeg') center/cover no-repeat;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      color:white;
      padding:20px;
      font-size:20px;
      font-weight:bold;
      background-color:rgba(0,0,0,0.5);
      background-blend-mode:darken;
    ">
      Je t’avais donné rendez-vous pour faire de la grande roue, t’en avais jamais fait ensuite on est allé au musée. Cette journée était cool
    </div>
  `;
}

function moveNo(){
  no.style.transform=`translate(${Math.random()*120-60}px,${Math.random()*80-40}px)`;
}

</script>

</body>
</html>
