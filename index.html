<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pour Chaimaa ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ff9acb,#ff5fa2);
  font-family:Arial,sans-serif;
  overflow:hidden;
  transition:background 1s ease;
}

/* ===== TITRE ===== */
#title{
  position:fixed;
  top:120px;
  left:50%;
  transform:translateX(-50%);
  font-size:32px;
  font-weight:900;
  color:#c00000;
  text-decoration:underline;
  letter-spacing:1px;
  text-shadow:0 2px 6px rgba(0,0,0,.25);
  z-index:20;
}

/* ===== CARTES ===== */
.card{
  display:none;
  background:#ffd6e8;
  padding:25px;
  border-radius:22px;
  width:90%;
  max-width:360px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
  position:relative;
  z-index:5;
}

/* ===== ENVELOPPE INTRO ===== */
.envelope{
  width:200px;
  cursor:pointer;
  animation:bounce 1.4s infinite;
}
@keyframes bounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

/* ===== FINAL ===== */
#final{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:10;
}

/* ===== ENVELOPPE RÉALISTE ===== */
.envelopeBox{
  position:relative;
  width:260px;
  height:180px;
  cursor:pointer;
}

.envelopeBox img{
  width:100%;
  position:absolute;
  left:0;
  top:0;
}

/* ===== FEUILLE ===== */
.paper{
  position:absolute;
  width:220px;
  height:140px;
  background:white;
  top:40px;
  left:20px;
  border-radius:6px;
  transform:translateY(60px);
  opacity:0;
  box-shadow:0 10px 25px rgba(0,0,0,.25);
  padding:20px;
  box-sizing:border-box;
}

/* ===== TEXTE FINAL ===== */
.paper h1{
  color:#ff3f87;
  font-size:26px;
  margin:0;
}
.paper p{
  color:#ff3f87;
  font-size:18px;
  margin-top:10px;
  opacity:0;
}

/* ===== COEURS ===== */
.heart{
  position:absolute;
  animation:floatHeart 6s linear forwards;
}
@keyframes floatHeart{
  from{transform:translateY(40px) scale(.6);opacity:0}
  20%{opacity:1}
  to{transform:translateY(-120px) scale(1);opacity:0}
}
</style>
</head>

<body>

<div id="title">À ma femme</div>

<div class="card" id="intro">
  <p>Clique sur l’enveloppe</p>
  <img src="envelope_closed.png" class="envelope" onclick="openIntro()">
</div>

<div id="final">
  <div class="envelopeBox" onclick="openEnvelope()">
    <img src="envelope_closed.png" id="envClosed">
    <img src="envelope_open.png" id="envOpen" style="display:none">
    <div class="paper" id="paper">
      <h1 id="typeText"></h1>
      <p id="subText">Joyeuse Saint Chaimaa Beauté 💖</p>
    </div>
  </div>
</div>

<script>
window.onload=()=>intro.style.display="block";

function openIntro(){
  intro.style.display="none";
  title.style.display="none";
  document.body.style.background="url('IMG_1083.jpeg') center/cover no-repeat";
  final.style.display="flex";
}

function openEnvelope(){
  envClosed.style.display="none";
  envOpen.style.display="block";

  paper.style.opacity=1;
  paper.style.transform="translateY(-40px)";
  paper.style.transition="transform 1s ease, opacity 1s ease";

  setTimeout(()=>{
    typeWriter("Je t’aime ❤️","typeText",120,()=>{
      subText.style.opacity=1;
    });
    setInterval(spawnHeart,250);
  },1000);
}

function typeWriter(text,id,speed,cb){
  let i=0;
  const el=document.getElementById(id);
  el.innerHTML="";
  const t=setInterval(()=>{
    el.innerHTML+=text.charAt(i++);
    if(i>=text.length){
      clearInterval(t);
      cb&&cb();
    }
  },speed);
}

function spawnHeart(){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.top=Math.random()*100+"vh";
  h.style.fontSize=18+Math.random()*24+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
}
</script>

</body>
</html>
