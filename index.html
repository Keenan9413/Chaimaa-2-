<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon amoureuse ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#4CAF50,#2e7d32);
  font-family:Arial,sans-serif;
  overflow:hidden;
}

/* TITRE */
#title{
  position:fixed;
  top:95px;
  left:50%;
  transform:translateX(-50%);
  font-size:30px;
  font-weight:900;
  color:#c00000;
  text-decoration:underline;
  white-space:nowrap;
}

/* COEURS */
.heart{
  position:fixed;
  color:red;
  font-size:20px;
  animation:floatHeart 5s linear forwards;
}
@keyframes floatHeart{
  from{transform:translateY(50px);opacity:0;}
  20%{opacity:1;}
  to{transform:translateY(-120px);opacity:0;}
}

/* CARTE */
.card{
  display:none;
  background:white;
  padding:25px;
  border-radius:22px;
  width:90%;
  max-width:360px;
  text-align:center;
}

/* 🔥 FIX PRINCIPAL */
#scene{
  position:fixed;
  inset:0;
  display:none;
  z-index:5;
}

/* ENVELOPPE */
.envelope{
  width:200px;
  cursor:pointer;
  animation:bounce 1.4s infinite;
}
@keyframes bounce{
  50%{transform:translateY(-10px);}
}

/* BOUTONS */
button{
  padding:12px 22px;
  border:none;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
  margin:10px;
}
.yes{background:#4CAF50;color:white;}
.no{background:#ccc;position:relative;}
.suite{background:#2196F3;color:white;}
</style>
</head>

<body>

<div id="title">À mon amoureuse</div>

<div class="card" id="intro">
  <h2>Mon amour ❤️</h2>
  <p>Clique sur l’enveloppe</p>
  <img src="IMG_5431.jpeg" class="envelope" onclick="start()">
</div>

<div id="scene"></div>

<script>

window.onload=()=>{
  intro.style.display="block";
  startHearts();
};

/* COEURS */
let heartInterval;
function spawnHeart(){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.top=Math.random()*100+"vh";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),5000);
}
function startHearts(){
  heartInterval=setInterval(spawnHeart,300);
}
function stopHearts(){
  clearInterval(heartInterval);
}

/* START */
function start(){
  intro.style.display="none";
  title.style.display="none";
  stopHearts();
  showScene1();
}

/* SCENE 1 */
function showScene1(){
  scene.style.display="block";
  scene.innerHTML=`
    <div style="background:white;padding:25px;border-radius:20px;max-width:360px;margin:auto;margin-top:100px;text-align:center;">
      <img src="IMG_3018.jpeg" style="width:100%;border-radius:15px;">
      <h2>Tu te souviens de cette journée ?</h2>
      <button class="yes" onclick="scene1Oui()">Oui ❤️</button>
      <button class="no" onmouseover="moveNo(this)">Non 💔</button>
    </div>
  `;
}

function scene1Oui(){
  scene.innerHTML=`
    <div style="height:100vh;background:url('IMG_3018.jpeg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:white;background-color:rgba(0,0,0,0.5);background-blend-mode:darken;padding:20px;">
      <p>Je t’avais donné rendez-vous pour faire de la grande roue...</p>
      <button class="suite" onclick="showScene2()">Suite ➡️</button>
    </div>
  `;
}

/* SCENE 2 */
function showScene2(){
  scene.innerHTML=`
    <div style="background:white;padding:25px;border-radius:20px;max-width:360px;margin:auto;margin-top:100px;text-align:center;">
      <img src="IMG_7864.jpeg" style="width:100%;border-radius:15px;">
      <h2>Cette journée à gravée n’est-ce pas ?</h2>
      <button class="yes" onclick="scene2Oui()">Oui ❤️</button>
      <button class="no" onmouseover="moveNo(this)">Non 💔</button>
    </div>
  `;
}

function scene2Oui(){
  scene.innerHTML=`
    <div style="height:100vh;background:url('IMG_7864.jpeg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:white;background-color:rgba(0,0,0,0.6);background-blend-mode:darken;padding:20px;">
      <p>Ce jour là ta mère n’était pas forcément d’accord...</p>
      <button class="suite" onclick="alert('suite suivante à brancher')">Suite ➡️</button>
    </div>
  `;
}

/* NON QUI FUIT */
function moveNo(btn){
  btn.style.transform=`translate(${Math.random()*120-60}px,${Math.random()*80-40}px)`;
}

</script>

</body>
</html>
