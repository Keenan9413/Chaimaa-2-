<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon amoureuse ❤️</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #4CAF50, #2e7d32);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* TITRE */
    #title {
      position: fixed;
      top: 95px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 30px;
      font-weight: 900;
      color: #c00000;
      text-decoration: underline;
      z-index: 20;
    }

    /* CARTE */
    .card {
      display: none;
      background: white;
      padding: 25px;
      border-radius: 22px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }

    /* ENVELOPPE */
    .envelope {
      width: 200px;
      cursor: pointer;
      animation: bounce 1.4s infinite;
    }

    @keyframes bounce {
      50% { transform: translateY(-10px); }
    }

    /* BOUTONS */
    button {
      padding: 12px 22px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px;
    }

    .yes { background: #4CAF50; color: white; }
    .no { background: #ccc; position: relative; }
    .suite { background: #2196F3; color: white; }
  </style>
</head>

<body>

  <div id="title">À mon amoureuse</div>

  <div class="card" id="intro">
    <h2>Mon amour ❤️</h2>
    <p>Clique sur l’enveloppe</p>
    <img src="IMG_5431.jpeg" class="envelope" onclick="start()">
  </div>

  <div class="card" id="scene"></div>

  <script>
    window.onload = () => intro.style.display = "block";

    function start() {
      intro.style.display = "none";
      title.style.display = "none";
      showScene1();
    }

    /* ===== SCENE 1 ===== */
    function showScene1() {
      scene.style.display = "block";
      scene.innerHTML = `
        <img src="IMG_3018.jpeg" style="width:100%;border-radius:15px;">
        <h2>Tu te souviens de cette journée ?</h2>
        <button class="yes" onclick="scene1Oui()">Oui ❤️</button>
        <button class="no" onmouseover="moveNo(this)">Non 💔</button>
      `;
    }

    function scene1Oui() {
      scene.innerHTML = `
        <div style="color:white;height:100vh;background:url('IMG_3018.jpeg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background-color:rgba(0,0,0,0.5);background-blend-mode:darken;">
          <p>Je t’avais donné rendez-vous pour faire de la grande roue...</p>
          <button class="suite" onclick="showScene2()">Suite ➡️</button>
        </div>
      `;
    }

    /* ===== SCENE 2 ===== */
    function showScene2() {
      scene.innerHTML = `
        <img src="IMG_7864.jpeg" style="width:100%;border-radius:15px;">
        <h2>Cette journée à gravée n’est-ce pas ?</h2>
        <button class="yes" onclick="scene2Oui()">Oui ❤️</button>
        <button class="no" onmouseover="moveNo(this)">Non 💔</button>
      `;
    }

    function scene2Oui() {
      scene.innerHTML = `
        <div style="color:white;height:100vh;background:url('IMG_7864.jpeg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background-color:rgba(0,0,0,0.6);background-blend-mode:darken;">
          <p>Ce jour-là ta mère n’était pas forcément d’accord...</p>
          <button class="suite" onclick="showScene3()">Suite ➡️</button>
        </div>
      `;
    }

    /* ===== SCENE 3 ===== */
    function showScene3() {
      scene.innerHTML = `
        <img src="IMG_3947.jpeg" style="width:100%;border-radius:15px;">
        <h2>Le meilleur Aïd</h2>
        <button class="yes" onclick="scene3Oui()">Oui ❤️</button>
        <button class="no" onmouseover="moveNo(this)">Non 💔</button>
      `;
    }

    function scene3Oui() {
      scene.innerHTML = `
        <div style="color:white;height:100vh;background:url('IMG_3947.jpeg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background-color:rgba(0,0,0,0.6);background-blend-mode:darken;">
          <p>C’était mon meilleur Aïd...</p>
          <button class="suite" onclick="showScene4()">Suite ➡️</button>
        </div>
      `;
    }

    /* ===== SCENE 4 ===== */
    function showScene4() {
      scene.innerHTML = `
        <img src="IMG_8328.jpeg" style="width:100%;border-radius:15px;">
        <h2>Cette journée au cinéma…</h2>
        <button class="yes" onclick="scene4Oui()">Oui ❤️</button>
        <button class="no" onmouseover="moveNo(this)">Non 💔</button>
      `;
    }

    function scene4Oui() {
      scene.innerHTML = `
        <div style="color:white;height:100vh;background:url('IMG_8328.jpeg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background-color:rgba(0,0,0,0.6);background-blend-mode:darken;">
          <p>Ce jour là je t’avais emmené au cinéma...</p>
        </div>
      `;
    }

    /* BOUTON NON QUI FUIT */
    function moveNo(btn) {
      btn.style.transform = `translate(${Math.random()*120-60}px, ${Math.random()*80-40}px)`;
    }
  </script>

</body>
</html>
