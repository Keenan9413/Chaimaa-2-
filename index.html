<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon amoureuse ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#4CAF50,#2e7d32);
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#title{
  position:fixed;
  top:95px;
  left:50%;
  transform:translateX(-50%);
  font-size:30px;
  font-weight:900;
  color:#c00000;
  text-decoration:underline;
  white-space:nowrap;
}

/* COEURS */
.heart{
  position:fixed;
  color:red;
  font-size:20px;
  animation:floatHeart 5s linear forwards;
  pointer-events:none;
  z-index:1;
}

@keyframes floatHeart{
  from{transform:translateY(50px) scale(0.8);opacity:0;}
  20%{opacity:1;}
  to{transform:translateY(-120px) scale(1.2);opacity:0;}
}

/* CARTE */
.card{
  display:none;
  background:white;
  padding:25px;
  border-radius:22px;
  width:90%;
  max-width:360px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}

/* SCENE FULL */
#scene{
  position:fixed;
  inset:0;
  display:none;
}

/* BOUTONS */
button{
  padding:12px 22px;
  border:none;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
  margin:10px;
}
.yes{background:#4CAF50;color:white;}
.no{background:#ccc;position:relative;}
.suite{background:#2196F3;color:white;}
</style>
</head>

<body>

<div id="title">À mon amoureuse</div>

<div class="card" id="intro">
  <h2>Mon amour ❤️</h2>
  <p>Clique sur l’enveloppe</p>
  <img src="IMG_5431.jpeg" style="width:200px" onclick="start()">
</div>

<div id="scene"></div>

<script>

window.onload=()=>intro.style.display="block";

/* START */
function start(){
  intro.style.display="none";
  title.style.display="none";
  showScene1();
}

/* SCENE 1 */
function showScene1(){
  scene.style.display="block";
  scene.innerHTML=`
    <img src="IMG_3018.jpeg" style="width:100%;border-radius:15px;">
    <h2>Tu te souviens de cette journée ?</h2>
    <button class="yes" onclick="scene1Oui()">Oui ❤️</button>
    <button class="no" onmouseover="moveNo(this)">Non 💔</button>
  `;
}

function scene1Oui(){
  scene.innerHTML=`
    <div style="height:100vh;background:url('IMG_3018.jpeg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:white;background-color:rgba(0,0,0,0.5);background-blend-mode:darken;">
      <p>Je t’avais donné rendez-vous pour faire de la grande roue...</p>
      <button class="suite" onclick="showScene2()">Suite ➡️</button>
    </div>
  `;
}

/* SCENE 2 */
function showScene2(){
  scene.innerHTML=`
    <img src="IMG_7864.jpeg" style="width:100%;border-radius:15px;">
    <h2>Cette journée à gravée n’est-ce pas ?</h2>
    <button class="yes" onclick="scene2Oui()">Oui ❤️</button>
    <button class="no" onmouseover="moveNo(this)">Non 💔</button>
  `;
}

function scene2Oui(){
  scene.innerHTML=`
    <div style="height:100vh;background:url('IMG_7864.jpeg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:white;background-color:rgba(0,0,0,0.6);background-blend-mode:darken;">
      <p>Ce jour là ta mère n’était pas forcément d’accord...</p>
      <button class="suite" onclick="showScene3()">Suite ➡️</button>
    </div>
  `;
}

/* SCENE 3 */
function showScene3(){
  scene.innerHTML=`
    <img src="IMG_3947.jpeg" style="width:100%;border-radius:15px;">
    <h2>Le meilleur Aïd</h2>
    <button class="yes" onclick="scene3Oui()">Oui ❤️</button>
    <button class="no" onmouseover="moveNo(this)">Non 💔</button>
  `;
}

function scene3Oui(){
  scene.innerHTML=`
    <div style="height:100vh;background:url('IMG_3947.jpeg') center/cover no-repeat;display:flex;justify-content:center;align-items:center;text-align:center;color:white;background-color:rgba(0,0,0,0.6);background-blend-mode:darken;">
      <p>C’était mon meilleur Aïd...</p>
      <button class="suite" onclick="showScene4()">Suite ➡️</button>
    </div>
  `;
}

/* SCENE 4 CINÉMA */
function showScene4(){
  scene.innerHTML=`
    <img src="IMG_8328.jpeg" style="width:100%;border-radius:15px;">
    <h2>Cette journée au cinéma…</h2>
    <button class="yes" onclick="scene4Oui()">Oui ❤️</button>
    <button class="no" onmouseover="moveNo(this)">Non 💔</button>
  `;

function scene4Oui(){
  scene.innerHTML=`

      <p>Ce jour là je t’avais emmené au cinéma...</p>
      <button class="suite" onclick="showScene5()">Suite ➡️</button>
    </div>
  `;
}

/* ⭐ NOUVELLE SCÈNE AJOUTÉE */
function showScene5(){
  scene.innerHTML=`
    <img src="IMG_3985.jpeg" style="width:100%;border-radius:15px;">
    <h2>Un souvenir spécial</h2>
    <p>Je te laisse relire ton poème que tu m’as fait pour la Saint Chaimaa et que tu vois à quel point tu m’aimes et surtout à quel point mon amour pour toi est sincère et pur car je ferais tout pour toi</p>

    <button class="yes" onclick="scene5Oui()">Oui ❤️</button>
    <button class="no" onmouseover="moveNo(this)">Non 💔</button>
  `;
}

function scene5Oui(){
  scene.innerHTML=`
    <div style="height:100vh;background:url('IMG_3986.jpeg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:white;background-color:rgba(0,0,0,0.6);background-blend-mode:darken;">
      <p>💖</p>
      <button class="suite" onclick="showScene6()">Suite ➡️</button>
    </div>
  `;
}

function showScene6(){
  scene.innerHTML=`
    <div style="height:100vh;background:url('IMG_3987.jpeg') center/cover no-repeat;display:flex;justify-content:center;align-items:center;text-align:center;color:white;background-color:rgba(0,0,0,0.6);background-blend-mode:darken;">
      <button class="suite" onclick="showScene7()">Suite ➡️</button>
    </div>

/* SCÈNE FINALE EXISTANTE */
function showScene7(){
  scene.innerHTML=`
    <img src="IMG_8560.jpeg" style="width:100%;border-radius:15px;">
    <h2>Pour finir</h2>
    <button class="yes" onclick="scene7Oui()">Déclaration ❤️</button>
  `;
}

function scene7Oui(){
  scene.innerHTML=`
    <div style="height:100vh;background:url('IMG_8560.jpeg') center/cover no-repeat;display:flex;justify-content:center;align-items:center;text-align:center;color:white;background-color:rgba(0,0,0,0.7);background-blend-mode:darken;">
      <p>Ma chérie, je demanderai la main à ton père très prochainement...</p>
    </div>
  `;
}

/* NON QUI FUIT */
function moveNo(btn){
  btn.style.transform=`translate(${Math.random()*120-60}px,${Math.random()*80-40}px)`;
}

</script>

</body>
</html>
