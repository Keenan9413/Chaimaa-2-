<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon amoureuse ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#4CAF50,#2e7d32);
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#title{
  position:fixed;
  top:95px;
  left:50%;
  transform:translateX(-50%);
  font-size:30px;
  font-weight:900;
  color:#c00000;
  text-decoration:underline;
  z-index:20;
  white-space:nowrap;
}

/* COEURS */
.heart{
  position:fixed;
  color:red;
  font-size:20px;
  animation:floatHeart 5s linear forwards;
  pointer-events:none;
  z-index:1;
}

@keyframes floatHeart{
  from{transform:translateY(50px) scale(0.8);opacity:0;}
  20%{opacity:1;}
  to{transform:translateY(-120px) scale(1.2);opacity:0;}
}

/* CARTE */
.card{
  display:none;
  background:white;
  padding:25px;
  border-radius:22px;
  width:90%;
  max-width:360px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
  z-index:5;
  position:relative;
  overflow:hidden;
}

/* ENVELOPPE */
.envelope{
  width:200px;
  cursor:pointer;
  animation:bounce 1.4s infinite;
}
@keyframes bounce{
  50%{transform:translateY(-10px);}
}

/* BOUTONS */
button{
  padding:12px 22px;
  border:none;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
  margin:10px;
}
.yes{background:#4CAF50;color:white;}
.no{background:#ccc;position:relative;}
.suite{background:#2196F3;color:white;}
</style>
</head>

<body>

<div id="title">À mon amoureuse</div>

<div class="card" id="intro">
  <h2>Mon amour ❤️</h2>
  <p>Clique sur l’enveloppe</p>
  <img src="IMG_5431.jpeg" class="envelope" onclick="start()">
</div>

<div class="card" id="scene"></div>

<script>

window.onload=()=>{
  intro.style.display="block";
  startHearts();
};

/* COEURS FOND */
let heartInterval;

function spawnHeart(){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.top=Math.random()*100+"vh";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),5000);
}

function startHearts(){
  heartInterval=setInterval(spawnHeart,300);
}

function stopHearts(){
  clearInterval(heartInterval);
}

/* COEURS SCENE */
let sceneHeartInterval;

function spawnSceneHeart(){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";

  const rect = scene.getBoundingClientRect();

  h.style.position="absolute";
  h.style.left=Math.random()*rect.width+"px";
  h.style.top=Math.random()*rect.height+"px";

  scene.appendChild(h);

  setTimeout(()=>h.remove(),4000);
}

function startSceneHearts(){
  stopSceneHearts();
  sceneHeartInterval=setInterval(spawnSceneHeart,250);
}

function stopSceneHearts(){
  clearInterval(sceneHeartInterval);
}

/* START */
function start(){
  intro.style.display="none";
  title.style.display="none";
  stopHearts();
  showScene1();
}

/* ===== SCENE 1 ===== */
function showScene1(){
  scene.style.display="block";
  scene.innerHTML=`
    <img src="IMG_3018.jpeg" style="width:100%;border-radius:15px;">
    <h2>Tu te souviens de cette journée ?</h2>
    <button class="yes" onclick="scene1Oui()">Oui ❤️</button>
    <button class="no" onmouseover="moveNo(this)">Non 💔</button>
  `;
  startSceneHearts();
}

function scene1Oui(){
  stopSceneHearts();
  scene.innerHTML=`
    <div style="color:white;height:100vh;background:url('IMG_3018.jpeg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background-color:rgba(0,0,0,0.5);background-blend-mode:darken;">
      <p>Je t’avais donné rendez-vous pour faire de la grande roue, t’en avais jamais fait ensuite on est allé au musée et ce jour là je m'en souviens t'étais fatigué et t'en avais marre d'être debout. Cette journée était vraiment cool beauté</p>
      <button class="suite" onclick="showScene2()">Suite ➡️</button>
    </div>
  `;
}

/* ===== SCENE 2 ===== */
function showScene2(){
  scene.innerHTML=`
    <img src="IMG_7864.jpeg" style="width:100%;border-radius:15px;">
    <h2>Cette journée à gravée n’est-ce pas ?</h2>
    <button class="yes" onclick="scene2Oui()">Oui ❤️</button>
    <button class="no" onmouseover="moveNo(this)">Non 💔</button>
  `;
  startSceneHearts();
}

function scene2Oui(){
  stopSceneHearts();
  scene.innerHTML=`
    <div style="color:white;height:100vh;background:url('IMG_7864.jpeg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background-color:rgba(0,0,0,0.6);background-blend-mode:darken;">
      <p>Ce jour là ta mère n’était pas forcément d’accord pour que tu sortes aussi tard avec moi et heureusement que ton père était là… C’était mémorable, t’as tenue, ton parfum, tes cheveux fin tout était magique je t’ai emmené au restaurant et je t’ai fait cette surprise de revenir avec pleins de cadeaux car tu le mérites. T’es cette femme que je veux gâter constamment pour te faire sourire et te rendre heureuse</p>
      <button class="suite" onclick="showScene3()">Suite ➡️</button>
    </div>
  `;
}

/* ===== SCENE 3 ===== */
function showScene3(){
  scene.innerHTML=`
    <img src="IMG_3947.jpeg" style="width:100%;border-radius:15px;">
    <h2>Le meilleur Aïd</h2>
    <button class="yes" onclick="scene3Oui()">Oui ❤️</button>
    <button class="no" onmouseover="moveNo(this)">Non 💔</button>
  `;
  startSceneHearts();
}

function scene3Oui(){
  stopSceneHearts();
  scene.innerHTML=`
    <div style="color:white;height:100vh;background:url('IMG_3947.jpeg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background-color:rgba(0,0,0,0.6);background-blend-mode:darken;">
      <p>C’était mon meilleur Aïd je t’avais ramené des fleurs pour toi et ta mère ainsi que des fleurs en forme de voile car ta mère est voilée et pour que tu puisses prier avec le tien qui est vert, ta couleur préférée. Chaque détail te concernant reste gravé dans ma mémoire sache le, tout ce que tu me dis je le retiens et je le réutilise par la suite dans le futur pour te montrer que je suis attentif à chaque fois que tu me parles et que je t’écoute car ça m’intéresse. Et pour le prochain ramadan on sera ensemble et plus chacun de notre côté comme les précédent car nous serons mariés</p>
      <button class="suite" onclick="showScene4()">Suite ➡️</button>
    </div>
  `;
}

/* ===== SCENE 4 ===== */
function showScene4(){
  scene.innerHTML=`
    <img src="IMG_8328.jpeg" style="width:100%;border-radius:15px;">
    <h2>Cette journée au cinéma…</h2>
    <button class="yes" onclick="scene4Oui()">Oui ❤️</button>
    <button class="no" onmouseover="moveNo(this)">Non 💔</button>
  `;
  startSceneHearts();
}

function scene4Oui(){
  stopSceneHearts();
  scene.innerHTML=`
    <div style="color:white;height:100vh;background:url('IMG_8328.jpeg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background-color:rgba(0,0,0,0.6);background-blend-mode:darken;">
      <p>Ce jour là je t’avais emmené au cinéma voir le marsupilami, je t’avais pris une rose comme signe d’attention et j’ai adoré cette soirée surtout quand tu m’avais pris le bras WILIWILIWILI comment c’était kiffant idem pour les photos c’était incroyable les souvenirs qu’on a créé alors que pourtant c’était qu’une journée banale au cinéma mais c’est toi, ma femme qui faisait toute cette différence. Ce soir là on a découvert tout les deux qu'on voulait donner le même prénom à nos enfants la probabilité était si mince et ‎الله nous a donné un signe tellement distinct qu'on ne peut l'ignorer idem pour les autres fois c'était toujours des signes de Dieu pour nous dire que nous sommes fait pour rester ensemble</p>
      <button class="suite" onclick="showScene5()">Suite ➡️</button>
    </div>
  `;
}

/* ===== SCENE 5 ===== */
function showScene5(){
  scene.innerHTML=`
    <img src="IMG_3948.jpeg" style="width:100%;border-radius:15px;">
    <h2>Les enfants</h2>
    <button class="yes" onclick="scene5Oui()">Oui ❤️</button>
    <button class="no" onmouseover="moveNo(this)">Non 💔</button>
  `;
  startSceneHearts();
}

function scene5Oui(){
  stopSceneHearts();
  scene.innerHTML=`
    <div style="color:white;height:100vh;background:url('IMG_3948.jpeg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background-color:rgba(0,0,0,0.6);background-blend-mode:darken;">
      <p>Une journée inattendue honnêtement… je ne pensais pas que t’allais rencontrer ma nièce et mon neveu de suite avec les problèmes de mon frère mais si je l’ai fait c’est parce que j’en avais réellement envie et surtout parce que je sais que t’es la bonne. Sur cette vidéo que j’ai transformé en photo tu parlais avec la petite et tu lui disais « Et là c’est qui ? C’est tata Chaimaa » même sur cette vidéo on voyait que tu étais déjà intégré en tant que tata pour elle, elle t’a tout de suite accepté et elle n’a jamais été aussi sage depuis que je la connais car t’as su y faire avec elle mais surtout parce que même les enfants t’ont acceptés dans notre famille. T’es leur tata chaimaa à jamais et ils auront des cousins cousines venant de toi et personne d’autre</p>
      <button class="suite" onclick="showScene6()">Suite ➡️</button>
    </div>
  `;
}

/* ===== SCENE 6 ===== */
function showScene6(){
  scene.innerHTML=`
    <img src="IMG_3985.jpeg" style="width:100%;border-radius:15px;">
    <h2>Sur cette lettre c'est ce que tu ressens pour moi et surtout à quel point mon amour pour toi et sincère et pure car je ferais tout pour toi</h2>
    <button class="yes" onclick="scene6Oui()">Oui ❤️</button>
    <button class="no" onmouseover="moveNo(this)">Non 💔</button>
  `;
  startSceneHearts();
}
  
function scene6Oui(){
  stopSceneHearts();
  scene.innerHTML=`
    <img src="IMG_3986.jpeg" style="width:100%;border-radius:15px;">
    <button class="suite" onclick="showScene7()">Suite ➡️</button>
    </div>
  `;
}

  
  
/* ===== SCENE 7 ===== */
function showScene7(){
  scene.innerHTML=`
    <img src="IMG_1992.jpeg" style="width:100%;border-radius:15px;">
    <h2>Journée mémorable et symbolique</h2>
    <button class="yes" onclick="scene6Oui()">Oui ❤️</button>
    <button class="no" onmouseover="moveNo(this)">Non 💔</button>
  `;
  startSceneHearts();
}

function scene7Oui(){
  stopSceneHearts();
  scene.innerHTML=`
    <div style="color:white;height:100vh;background:url('IMG_1992.jpeg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background-color:rgba(0,0,0,0.6);background-blend-mode:darken;">
      <p>Ce jour là j’étais tellement reconnaissant que t’ai accepté de m’accompagner alors qu’il y avait ma mère t’aurais pu refuser et au final t’as accepté ce qui montre l’importance que j’ai à tes yeux. C’était tellement magique de pouvoir vivre cette journée tous les trois tu n’as pas idée et j’espère vivre cette même soirée durant ta remise. Ça a été une journée hyper symbolique, tu as rencontré ma mère, la première et dernière fille qui la rencontrera. Tout s’est bien passé entre vous Al hamdoulillah et tu continueras à la voir parce que je ne te lâcherai pas, tu es ma femme, ma moitié, mon tout et jamais je ne te laisserai t'en aller je t'aime trop pour ça. Sache que ma mère est tellement contente qu’on soit ensemble qu’elle à parlé à tout le monde, elle l'a annoncé à nos deux banquières pour notre mariage NOS BANQUIÈRES elles ont 50 ans et elles savent notre vie alors que je parle pas de base, c’est pour te dire à quel point elle est enthousiaste pour nous deux</p>
      <button class="suite" onclick="showScene7()">Suite ➡️</button
    </div>
  `;
}

/* ===== SCENE 8 ===== */
function showScene8(){
  scene.innerHTML=`
    <img src="IMG_8560.jpeg" style="width:100%;border-radius:15px;">
    <h2>Pour finir</h2>
    <button class="yes" onclick="scene7Oui()">Déclaration ❤️</button>
  `;
}

function scene8Oui(){
  stopSceneHearts();
  scene.innerHTML=`
    <div style="color:white;height:100vh;background:url('IMG_8560.jpeg') center/cover no-repeat;display:flex;justify-content:center;align-items:center;text-align:center;background-color:rgba(0,0,0,0.7);background-blend-mode:darken;">
      <p>Ma chérie, je demanderai la main à ton père très prochainement il est hors de question qu’un autre homme mette les mains sur toi ou prenne ma place devant ‎الله et à la mairie. Je t’en fais la promesse que tu ne manqueras de rien et que tu n’auras pas de doute à mon égard, je te prouverai jour après jour l’amour que j’ai pour toi et en aucun cas tu te poseras des questions. Chaque fois qu’on se parle je le prends en considération et je ne minimise jamais ce que tu ressens loin de là tout ce que tu me dis je fais en sorte de l’améliorer. Pour rien au monde je prendrai le risque de te perdre, je vais te marier et on sera enfin ensemble rien que nous deux parce que c’est ce que j’attends depuis toutes ces années et toi aussi. Tes parents savent qui je suis et je veux qu’ils voient et que tu vois que depuis le début tout ce que je dis est vrai quand je t’ai dis que je serai celui qui te mettra la bague au doigt c’est la vérité car c’est mon rôle et je suis le seul à avoir ce rôle te concernant. Je te lâcherai jamais car si j’abandonne maintenant et que je te laisse partir alors concrètement c’est que tu n’avais pas d’importance à mes yeux chose qui est totalement fausse, tu es la prunelle de mes yeux et je veux que plus tard nos enfants voient le parcours qu’on aura fait ensemble car le véritable amour est le notre, solide, indestructible et surtout qui dure sur la durée et jusqu’à la fin. Je serai le premier et dernier homme à rentrer dans ta vie et tu seras la première et dernière femme à rentrer dans la mienne car il n’y en a qu’une qui m’est destiné et الله me l’a prouvé à moi et à toi constamment durant toutes ces années qu’on est naseeb. On va sûrement déménager donc il est hors de question que je m’éloigne encore plus de toi en terme de distance. Je t’aime pour toujours et à jamais et fais-moi confiance الله en est encore témoin tu ne le regretteras pas ❤️💍</p>
    </div>
  `;
}

/* NON QUI BOUGE */
function moveNo(btn){
  btn.style.transform=`translate(${Math.random()*120-60}px,${Math.random()*80-40}px)`;
}

</script>

</body>
</html>
