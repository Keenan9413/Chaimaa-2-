<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon amoureuse ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  background:linear-gradient(135deg,#4CAF50,#2e7d32);
  font-family:Arial,sans-serif;
  overflow:hidden;
}

/* TITRE */
#title{
  position:fixed;
  top:95px;
  left:50%;
  transform:translateX(-50%);
  font-size:30px;
  font-weight:900;
  color:#c00000;
  text-decoration:underline;
  white-space:nowrap;
}

/* COEURS */
.heart{
  position:fixed;
  color:red;
  font-size:20px;
  animation:floatHeart 5s linear forwards;
}
@keyframes floatHeart{
  from{transform:translateY(50px);opacity:0;}
  20%{opacity:1;}
  to{transform:translateY(-120px);opacity:0;}
}

/* INTRO */
.card{
  display:none;
  background:white;
  padding:25px;
  border-radius:22px;
  width:90%;
  max-width:360px;
  text-align:center;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

/* SCENE FULL */
#scene{
  position:fixed;
  inset:0;
  display:none;
}

/* CONTENU SCROLLABLE */
.content{
  max-height:80vh;
  overflow-y:auto;
  padding:20px;
}

/* ENVELOPPE */
.envelope{
  width:200px;
  cursor:pointer;
  animation:bounce 1.4s infinite;
}
@keyframes bounce{
  50%{transform:translateY(-10px);}
}

/* BOUTONS */
button{
  padding:12px 22px;
  border:none;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
  margin:10px;
}
.yes{background:#4CAF50;color:white;}
.no{background:#ccc;position:relative;}
.suite{background:#2196F3;color:white;}
</style>
</head>

<body>

<div id="title">À mon amoureuse</div>

<div class="card" id="intro">
  <h2>Mon amour ❤️</h2>
  <p>Clique sur l’enveloppe</p>
  <img src="IMG_5431.jpeg" class="envelope" onclick="start()">
</div>

<div id="scene"></div>

<script>

/* COEURS */
let heartInterval;
function spawnHeart(){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.top=Math.random()*100+"vh";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),5000);
}
function startHearts(){
  heartInterval=setInterval(spawnHeart,300);
}
function stopHearts(){
  clearInterval(heartInterval);
}

window.onload=()=>{
  intro.style.display="block";
  startHearts();
};

/* START */
function start(){
  intro.style.display="none";
  title.style.display="none";
  stopHearts();
  showScene1();
}

/* SCENE 1 */
function showScene1(){
  scene.style.display="block";
  scene.innerHTML=`
  <div style="background:white;padding:25px;border-radius:20px;max-width:360px;margin:auto;margin-top:80px;text-align:center;">
    <img src="IMG_3018.jpeg" style="width:100%;border-radius:15px;">
    <h2>Tu te souviens de cette journée ?</h2>
    <button class="yes" onclick="scene1Oui()">Oui ❤️</button>
    <button class="no" onmouseover="moveNo(this)">Non 💔</button>
  </div>`;
}

function scene1Oui(){
  scene.innerHTML=`
  <div style="height:100vh;background:url('IMG_3018.jpeg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:white;background-color:rgba(0,0,0,0.5);background-blend-mode:darken;">
    <div class="content">
      <p>Je t’avais donné rendez-vous pour faire de la grande roue, t’en avais jamais fait ensuite on est allé au musée et ce jour là je m'en souviens t'étais fatigué et t'en avais marre d'être debout. Cette journée était vraiment cool beauté</p>
      <button class="suite" onclick="showScene2()">Suite ➡️</button>
    </div>
  </div>`;
}

/* SCENE 2 */
function showScene2(){
  scene.innerHTML=`
  <div style="background:white;padding:25px;border-radius:20px;max-width:360px;margin:auto;margin-top:80px;text-align:center;">
    <img src="IMG_7864.jpeg" style="width:100%;border-radius:15px;">
    <h2>Cette journée à gravée n’est-ce pas ?</h2>
    <button class="yes" onclick="scene2Oui()">Oui ❤️</button>
    <button class="no" onmouseover="moveNo(this)">Non 💔</button>
  </div>`;
}

function scene2Oui(){
  scene.innerHTML=`
  <div style="height:100vh;background:url('IMG_7864.jpeg') center/cover no-repeat;display:flex;justify-content:center;align-items:center;text-align:center;color:white;background-color:rgba(0,0,0,0.6);background-blend-mode:darken;">
    <div class="content">
      <p>Ce jour là ta mère n’était pas forcément d’accord pour que tu sortes aussi tard avec moi et heureusement que ton père était là… C’était mémorable, t’as tenue, ton parfum, tes cheveux fin tout était magique je t’ai emmené au restaurant et je t’ai fait cette surprise de revenir avec pleins de cadeaux car tu le mérites. T’es cette femme que je veux gâter constamment pour te faire sourire et te rendre heureuse</p>
      <button class="suite" onclick="showScene3()">Suite ➡️</button>
    </div>
  </div>`;
}

/* SCENE 3 */
function showScene3(){
  scene.innerHTML=`
  <div style="background:white;padding:25px;border-radius:20px;max-width:360px;margin:auto;margin-top:80px;text-align:center;">
    <img src="IMG_3947.jpeg" style="width:100%;border-radius:15px;">
    <h2>Le meilleur Aïd</h2>
    <button class="yes" onclick="scene3Oui()">Oui ❤️</button>
    <button class="no" onmouseover="moveNo(this)">Non 💔</button>
  </div>`;
}

function scene3Oui(){
  scene.innerHTML=`
  <div style="height:100vh;background:url('IMG_3947.jpeg') center/cover no-repeat;display:flex;justify-content:center;align-items:center;text-align:center;color:white;background-color:rgba(0,0,0,0.6);background-blend-mode:darken;">
    <div class="content">
      <p>C’était mon meilleur Aïd je t’avais ramené des fleurs pour toi et ta mère ainsi que des fleurs en forme de voile car ta mère est voilée et pour que tu puisses prier avec le tien qui est vert, ta couleur préférée. Chaque détail te concernant reste gravé dans ma mémoire sache le, tout ce que tu me dis je le retiens et je le réutilise par la suite dans le futur pour te montrer que je suis attentif à chaque fois que tu me parles et que je t’écoute car ça m’intéresse. Et pour le prochain ramadan on sera ensemble et plus chacun de notre côté comme les précédent car nous serons mariés</p>
      <button class="suite" onclick="showScene4()">Suite ➡️</button>
    </div>
  </div>`;
}

/* etc... tu peux continuer pareil */

/* NON QUI FUIT */
function moveNo(btn){
  btn.style.transform=`translate(${Math.random()*120-60}px,${Math.random()*80-40}px)`;
}

</script>

</body>
</html>
