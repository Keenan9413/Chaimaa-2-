<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon amoureuse ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#4CAF50,#2e7d32);
  font-family:Arial,sans-serif;
  overflow:hidden;
  transition:background 1s ease;
}

/* ===== TITRE ===== */
#title{
  position:fixed;
  top:95px;
  left:50%;
  transform:translateX(-50%);
  font-size:30px;
  font-weight:900;
  color:#c00000;
  text-decoration:underline;
  z-index:20;
}

/* ===== CARTES ===== */
.card{
  display:none;
  background:#ffffff;
  padding:25px;
  border-radius:22px;
  width:90%;
  max-width:360px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
  position:relative;
  z-index:5;
}

/* ===== INTRO ===== */
.introTitle{
  font-size:30px;
  font-weight:900;
  margin-bottom:15px;
}

/* ===== ENVELOPPE ===== */
.envelope{
  width:200px;
  cursor:pointer;
  animation:bounce 1.4s infinite;
}
@keyframes bounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

/* ===== BOUTONS ===== */
button{
  padding:12px 22px;
  border:none;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
  margin:10px;
}
#yes{background:#4CAF50;color:white;}
#no{background:#ccc;position:absolute}
#suite{background:#2196F3;color:white;}

</style>
</head>

<body>

<div id="title">À mon amoureuse </div>

<div class="card" id="intro">
  <div class="introTitle">Mon amour ❤️</div>
  <p>Clique sur l’enveloppe</p>
  <img src="IMG_5431.jpeg" class="envelope" onclick="openIntro()">
</div>

<!-- ETAPE 1 -->
<div class="card" id="question">
  <img src="IMG_3018.jpeg" style="width:100%;border-radius:15px;margin-bottom:15px;">
  
  <h2>Tu te souviens de cette journée ?</h2>

  <button id="yes" onclick="reponseOui()">Oui ❤️</button>
  <button id="no" onmouseover="moveNo()">Non 💔</button>
</div>

<script>

window.onload=()=>intro.style.display="block";

function openIntro(){
  intro.style.display="none";
  question.style.display="block";
  document.body.style.background = "#000";
}

/* ===== ETAPE 1 -> TEXTE + SUITE ===== */
function reponseOui(){
  document.body.innerHTML = `
    <div style="
      height:100vh;
      background:url('IMG_3018.jpeg') center/cover no-repeat;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      color:white;
      padding:20px;
      font-size:20px;
      font-weight:bold;
      background-color:rgba(0,0,0,0.5);
      background-blend-mode:darken;
    ">
      <p>
        Je t’avais donné rendez-vous pour faire de la grande roue, t’en avais jamais fait ensuite on est allé au musée. Cette journée était cool
      </p>

      <button id="suite" onclick="suite1()">Suite ➡️</button>
    </div>
  `;
}

/* ===== ETAPE 2 ===== */
function suite1(){
  document.body.innerHTML = `
    <div style="
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#000;
    ">
      <div style="
        background:white;
        padding:20px;
        border-radius:20px;
        text-align:center;
        max-width:350px;
      ">
        <img src="IMG_7864.jpeg" style="width:100%;border-radius:15px;margin-bottom:15px;">
        
        <h2>Cette journée à gravée n’est-ce pas ?</h2>

        <button onclick="suiteOui()">Oui ❤️</button>
        <button id="no" onmouseover="moveNo()">Non 💔</button>
      </div>
    </div>
  `;
}

/* ===== ETAPE 3 ===== */
function suiteOui(){
  document.body.innerHTML = `
    <div style="
      height:100vh;
      background:url('IMG_7864.jpeg') center/cover no-repeat;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      color:white;
      padding:20px;
      font-size:18px;
      font-weight:bold;
      background-color:rgba(0,0,0,0.6);
      background-blend-mode:darken;
    ">
      <p>
        Ce jour là ta mère n’était pas forcément d’accord pour que tu sortes aussi tard avec moi et heureusement que ton père était là… 
        C’était mémorable, t’as tenue, ton parfum, tes cheveux fin tout était magique je t’ai emmené au restaurant et je t’ai fait cette surprise 
        de revenir avec pleins de cadeaux car tu le mérites. T’es cette femme que je veux gâter constamment pour te faire sourire et te rendre heureuse.
      </p>

      <button id="suite" onclick="alert('On continue après 😏')">Suite ➡️</button>
    </div>
  `;
}

/* ===== BOUTON NON QUI FUIT ===== */
function moveNo(){
  const noBtn = document.getElementById("no");
  if(noBtn){
    noBtn.style.position="relative";
    noBtn.style.transform=`translate(${Math.random()*120-60}px,${Math.random()*80-40}px)`;
  }
}

</script>

</body>
</html>
