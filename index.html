<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Mon amoureuse ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#4CAF50,#2e7d32);
  font-family:Arial,sans-serif;
  overflow:hidden;
}

/* ===== TITRE (FIX UNE LIGNE) ===== */
#title{
  position:fixed;
  top:95px;
  left:50%;
  transform:translateX(-50%);
  font-size:30px;
  font-weight:900;
  color:#c00000;
  text-decoration:underline;
  z-index:20;
  white-space:nowrap; /* ✅ force une seule ligne */
}

/* ===== COEURS ===== */
.heart{
  position:fixed;
  color:red;
  font-size:20px;
  animation:floatHeart 5s linear forwards;
  pointer-events:none;
  z-index:1;
}

@keyframes floatHeart{
  from{
    transform:translateY(50px) scale(0.8);
    opacity:0;
  }
  20%{opacity:1;}
  to{
    transform:translateY(-120px) scale(1.2);
    opacity:0;
  }
}

/* CARTE */
.card{
  display:none;
  background:white;
  padding:25px;
  border-radius:22px;
  width:90%;
  max-width:360px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
  z-index:5;
}

/* ENVELOPPE */
.envelope{
  width:200px;
  cursor:pointer;
  animation:bounce 1.4s infinite;
}
@keyframes bounce{
  50%{transform:translateY(-10px);}
}

/* BOUTONS */
button{
  padding:12px 22px;
  border:none;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
  margin:10px;
}
.yes{background:#4CAF50;color:white;}
.no{background:#ccc;position:relative;}
.suite{background:#2196F3;color:white;}
</style>
</head>

<body>

<div id="title">À mon amoureuse</div>

<div class="card" id="intro">
  <h2>Mon amour ❤️</h2>
  <p>Clique sur l’enveloppe</p>
  <img src="IMG_5431.jpeg" class="envelope" onclick="start()">
</div>

<div class="card" id="scene"></div>

<script>

window.onload=()=>{
  intro.style.display="block";
  startHearts(); // ❤️ démarre les cœurs
};

/* ===== COEURS QUI SPAWN ===== */
let heartInterval;

function spawnHeart(){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.top=Math.random()*100+"vh";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),5000);
}

function startHearts(){
  heartInterval=setInterval(spawnHeart,300);
}

function stopHearts(){
  clearInterval(heartInterval);
}

/* ===== START ===== */
function start(){
  intro.style.display="none";
  title.style.display="none";
  stopHearts(); // ❌ stop les cœurs après début
  showScene1();
}

/* ===== SCENE 1 ===== */
function showScene1(){
  scene.style.display="block";
  scene.innerHTML=`
    <img src="IMG_3018.jpeg" style="width:100%;border-radius:15px;">
    <h2>Tu te souviens de cette journée ?</h2>
    <button class="yes" onclick="scene1Oui()">Oui ❤️</button>
    <button class="no" onmouseover="moveNo(this)">Non 💔</button>
  `;
}

function scene1Oui(){
  scene.innerHTML=`
    <div style="color:white;height:100vh;background:url('IMG_3018.jpeg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background-color:rgba(0,0,0,0.5);background-blend-mode:darken;">
      <p>Je t’avais donné rendez-vous pour faire de la grande roue, t’en avais jamais fait ensuite on est allé au musée et ce jour là je m'en souviens t'étais fatigué et t'en avais marre d'être debout. Cette journée était vraiment cool beauté </p>
      <button class="suite" onclick="showScene2()">Suite ➡️</button>
    </div>
  `;
}

/* ===== LE RESTE DE TON CODE NE CHANGE PAS ===== */

function showScene2(){/* inchangé */}
function scene2Oui(){/* inchangé */}
function showScene3(){/* inchangé */}
function scene3Oui(){/* inchangé */}
function showScene4(){/* inchangé */}
function scene4Oui(){/* inchangé */}
function showScene5(){/* inchangé */}
function scene5Oui(){/* inchangé */}
function showScene6(){/* inchangé */}
function scene6Oui(){/* inchangé */}
function showScene7(){/* inchangé */}
function scene7Oui(){/* inchangé */}

function moveNo(btn){
  btn.style.transform=`translate(${Math.random()*120-60}px,${Math.random()*80-40}px)`;
}

</script>

</body>
</html>
