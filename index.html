<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon amoureuse ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#4CAF50,#2e7d32);
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#title{
  position:fixed;
  top:95px;
  left:50%;
  transform:translateX(-50%);
  font-size:30px;
  font-weight:900;
  color:#c00000;
  text-decoration:underline;
  z-index:20;
  white-space:nowrap;
}

/* COEURS */
.heart{
  position:fixed;
  color:red;
  font-size:20px;
  animation:floatHeart 5s linear forwards;
  pointer-events:none;
  z-index:1;
}

@keyframes floatHeart{
  from{transform:translateY(50px) scale(0.8);opacity:0;}
  20%{opacity:1;}
  to{transform:translateY(-120px) scale(1.2);opacity:0;}
}

/* CARTE */
.card{
  display:none;
  background:white;
  padding:25px;
  border-radius:22px;
  width:90%;
  max-width:360px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
  z-index:5;
  position:relative;
  overflow:hidden;
}

/* ENVELOPPE */
.envelope{
  width:200px;
  cursor:pointer;
  animation:bounce 1.4s infinite;
}
@keyframes bounce{
  50%{transform:translateY(-10px);}
}

/* BOUTONS */
button{
  padding:12px 22px;
  border:none;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
  margin:10px;
}
.yes{background:#4CAF50;color:white;}
.no{background:#ccc;position:relative;}
.suite{background:#2196F3;color:white;}
</style>
</head>

<body>

<div id="title">À mon amoureuse</div>

<div class="card" id="intro">
  <h2>Mon amour ❤️</h2>
  <p>Clique sur l’enveloppe</p>
  <img src="IMG_5431.jpeg" class="envelope" onclick="start()">
</div>

<div class="card" id="scene"></div>

<script>

window.onload=()=>{
  intro.style.display="block";
  startHearts();
};

/* COEURS */
let heartInterval;

function spawnHeart(){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.top=Math.random()*100+"vh";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),5000);
}

function startHearts(){
  heartInterval=setInterval(spawnHeart,300);
}

function stopHearts(){
  clearInterval(heartInterval);
}

/* SCENE HEARTS */
let sceneHeartInterval;

function spawnSceneHeart(){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  const rect = scene.getBoundingClientRect();
  h.style.position="absolute";
  h.style.left=Math.random()*rect.width+"px";
  h.style.top=Math.random()*rect.height+"px";
  scene.appendChild(h);
  setTimeout(()=>h.remove(),4000);
}

function startSceneHearts(){
  stopSceneHearts();
  sceneHeartInterval=setInterval(spawnSceneHeart,250);
}

function stopSceneHearts(){
  clearInterval(sceneHeartInterval);
}

/* START */
function start(){
  intro.style.display="none";
  title.style.display="none";
  stopHearts();
  showScene1();
}

/* ===== SCENE 1 ===== */
function showScene1(){
  scene.style.display="block";
  scene.innerHTML=`
    <img src="IMG_3018.jpeg" style="width:100%;border-radius:15px;">
    <h2>Tu te souviens de cette journée ?</h2>
    <button class="yes" onclick="scene1Oui()">Oui ❤️</button>
    <button class="no" onmouseover="moveNo(this)">Non 💔</button>
  `;
  startSceneHearts();
}

function scene1Oui(){
  scene.innerHTML=`
    <div style="color:white;height:100vh;background:url('IMG_3018.jpeg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background-color:rgba(0,0,0,0.5);background-blend-mode:darken;">
      <p>Je t’avais donné rendez-vous pour faire de la grande roue, t’en avais jamais fait ensuite on est allé au musée et ce jour là je m'en souviens t'étais fatigué et t'en avais marre d'être debout. Cette journée était vraiment cool beauté</p>
      <button class="suite" onclick="showScene2()">Suite ➡️</button>
    </div>
  `;
}

/* ===== SCENE 2 ===== */
function showScene2(){
  scene.innerHTML=`
    <img src="IMG_7864.jpeg" style="width:100%;border-radius:15px;">
    <h2>Cette journée à gravée n’est-ce pas ?</h2>
    <button class="yes" onclick="scene2Oui()">Oui ❤️</button>
    <button class="no" onmouseover="moveNo(this)">Non 💔</button>
  `;
}

function scene2Oui(){
  scene.innerHTML=`
    <div style="color:white;height:100vh;background:url('IMG_7864.jpeg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background-color:rgba(0,0,0,0.6);background-blend-mode:darken;">
      <p>Ce jour là ta mère n’était pas forcément d’accord pour que tu sortes aussi tard avec moi et heureusement que ton père était là… C’était mémorable, t’as tenue, ton parfum, tes cheveux fin tout était magique je t’ai emmené au restaurant et je t’ai fait cette surprise de revenir avec pleins de cadeaux car tu le mérites. T’es cette femme que je veux gâter constamment pour te faire sourire et te rendre heureuse</p>
      <button class="suite" onclick="showScene3()">Suite ➡️</button>
    </div>
  `;
}

/* ===== SCENE 3 ===== */
function showScene3(){
  scene.innerHTML=`
    <img src="IMG_3947.jpeg" style="width:100%;border-radius:15px;">
    <h2>Le meilleur Aïd</h2>
    <button class="yes" onclick="scene3Oui()">Oui ❤️</button>
    <button class="no" onmouseover="moveNo(this)">Non 💔</button>
  `;
}

/* ===== SCENE 3 ===== */
function scene3Oui(){
  scene.innerHTML=`
    <div style="color:white;height:100vh;background:url('IMG_3947.jpeg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background-color:rgba(0,0,0,0.6);background-blend-mode:darken;">
      <p>C’était mon meilleur Aïd je t’avais ramené des fleurs pour toi et ta mère ainsi que des fleurs en forme de voile car ta mère est voilée et pour que tu puisses prier avec le tien qui est vert, ta couleur préférée. Chaque détail te concernant reste gravé dans ma mémoire sache le, tout ce que tu me dis je le retiens et je le réutilise par la suite dans le futur pour te montrer que je suis attentif à chaque fois que tu me parles et que je t’écoute car ça m’intéresse.</p>
      <button class="suite" onclick="showScene4()">Suite ➡️</button>
    </div>
  `;
}

/* ===== SCENE 4 CINEMA ===== */
function showScene4(){

    <img src="IMG_8328.jpeg" style="width:100%;border-radius:15px;">
    <h2>Cette journée au cinéma…</h2>
    <button class="yes" onclick="scene4Oui()">Oui ❤️</button>

    <img src="IMG_3948.jpeg" style="width:100%;border-radius:15px;">
    <h2>Les enfants</h2>

/* ===== SCENE 6 ===== */
function showScene6(){
  scene.innerHTML=`
    <img src="IMG_1992.jpeg" style="width:100%;border-radius:15px;">
    <h2>Journée mémorable et symbolique</h2>
    <button class="yes" onclick="scene6Oui()">Oui ❤️</button>
    <button class="no" onmouseover="moveNo(this)">Non 💔</button>

/* ======================= */
/* 🔥 NOUVELLE PARTIE AJOUTÉE */

function showScene7(){
  scene.innerHTML=`
    <img src="IMG_3985.jpeg" style="width:100%;border-radius:15px;">
    <h2>Poème Saint Chaimaa</h2>
    <button class="yes" onclick="scene7Oui()">Oui ❤️</button>
    <button class="no" onmouseover="moveNo(this)">Non 💔</button>
  `;
}

function scene7Oui(){
  scene.innerHTML=`
    <div style="color:white;height:100vh;background:url('IMG_3985.jpeg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background-color:rgba(0,0,0,0.6);background-blend-mode:darken;">
      <p>je te laisse relire ton poème que tu m’as fait pour la Saint Chaimaa et que tu vois à quel point tu m’aimes et surtout à quel point mon amour pour toi et sincère et pure car je ferais tout pour toi</p>
      <button class="suite" onclick="showScene8()">Suite ➡️</button>
    </div>
  `;
}

function showScene8(){
  scene.innerHTML=`
    <img src="IMG_3986.jpeg" style="width:100%;border-radius:15px;">
    <button class="suite" onclick="showScene9()">Suite ➡️</button>
  `;
}

function showScene9(){
  scene.innerHTML=`
    <img src="IMG_3987.jpeg" style="width:100%;border-radius:15px;">
    <button class="suite" onclick="showScene4()">Suite ➡️</button>
  `;
}

/* ===== SUITE EXISTANTE ===== */
function scene4Oui(){
  scene.innerHTML=`
    <div style="color:white;height:100vh;background:url('IMG_8328.jpeg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background-color:rgba(0,0,0,0.6);background-blend-mode:darken;">
      <p>Ce jour là je t’avais emmené au cinéma voir le marsupilami...</p>
      <button class="suite" onclick="showScene5()">Suite ➡️</button>
    </div>
  `;
}

/* NON */
function moveNo(btn){
  btn.style.transform=`translate(${Math.random()*120-60}px,${Math.random()*80-40}px)`;
}

</script>

</body>
</html>
